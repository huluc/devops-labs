---
- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
  become: true

- name: Enable required proxy modules
  ansible.builtin.command: a2enmod proxy proxy_http proxy_balancer lbmethod_byrequests
  register: a2enmod_result
  changed_when: "'Enabling module' in a2enmod_result.stdout"
  become: true
  notify: Restart Apache

- name: Deploy load balancer vhost
  ansible.builtin.template:
    src: loadbalancer.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf
    mode: "0644"
  become: true
  notify: Restart Apache

- name: Ensure Apache is running and enabled
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
  become: true
