apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx              # Selects Pods labeled "app=nginx" (our Deployment’s Pods)
  ports:
    - protocol: TCP
      port: 80               # The port that the Service will serve on
      targetPort: 80         # The port on the Pod’s container to forward traffic to
      nodePort: 30080
  type: NodePort          # Exposes the Service only inside the cluster
 